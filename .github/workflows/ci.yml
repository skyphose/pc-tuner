name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate module JSON
        shell: pwsh
        run: |
          Get-ChildItem modules -Filter *.json | ForEach-Object {
            $null = Get-Content $_.FullName -Raw | ConvertFrom-Json
            Write-Host "OK: $($_.Name)"
          }

      - name: Syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "SYNTAX ERROR $($_.Extent.File): $($_.Message)" }
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

      - name: Engine smoke test (read-only status)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\pc-tuner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GUI self-test (builds window without showing it)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\pc-tuner-gui.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
