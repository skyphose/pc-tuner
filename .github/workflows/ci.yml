name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate modules (schema + protected-location rules)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\pc-tuner.ps1 -Validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "SYNTAX ERROR $($_.Extent.File): $($_.Message)" }
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

      - name: Engine smoke test (read-only status)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\pc-tuner.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Engine round-trip test (apply/revert on a throwaway HKCU key)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\roundtrip.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GUI self-test (builds window without showing it)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\pc-tuner-gui.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
